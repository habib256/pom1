# CI: build POM1 on all three desktop platforms AND under Emscripten, run the
# full ctest suite on all three desktops (Klaus functional test + every smoke
# test + the GEN2 graphics-regression golden), and assemble all the dev/ 6502
# projects.
#
# It used to be a single Linux job, with macOS and Windows built ONLY by the
# tag-driven release workflow — so a break on either was discovered at the worst
# possible moment, while publishing. That is not hypothetical: the Homebrew
# dylib baked into the macOS .dmg with an absolute /usr/local path shipped a
# package that died at dyld on every Apple Silicon machine, and no Linux job
# could have seen it. The two jobs below are build-only (no packaging, no
# signing, no cc65) — the cheapest thing that turns "it compiles and links on
# your platform" into a fact instead of a hope.
#
# The `wasm` job and the ctest steps on macOS/Windows were added on 2026-08-22,
# after three breakages landed on main in a single merge — all three in the same
# quadrant: code that no local run and no per-push job compiled or executed.
# Before it, macOS and Windows built 50 test binaries and threw them away, and
# the web bundle was built only by pages.yml, on main, after the merge.
#
# The nightly `sanitizers` job covers what 90 green functional tests
# structurally cannot: overruns, uninitialised reads, and races.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, 03:17 UTC. Off-peak, and a prime-ish minute so it doesn't pile
    # onto the top-of-hour surge on GitHub's shared runners.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the committed WASM cc65 toolchain is present
        run: tools/verify_wasm_cc65.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev cc65 \
                                  libgles2-mesa-dev libegl1-mesa-dev

      - name: Fetch Dear ImGui (pin from IMGUI_VERSION)
        run: tools/ensure_imgui.sh imgui

      - name: Build POM1
        # -DPOM1_WERROR=ON is CI-only, deliberately: a warning must never block
        # someone's local build mid-experiment, but it must never reach main
        # either. The tree was brought to zero warnings under -Wall -Wextra when
        # the flags were introduced, so this gate starts clean.
        run: |
          cmake -S . -B build -DPOM1_WERROR=ON
          cmake --build build -j"$(nproc)"

      - name: Compile the GL TUs the way Windows sees them (no glext.h)
        # The Windows SDK ships a GL 1.1 <GL/gl.h> and NO <GL/glext.h>, so the
        # shader/CRT translation units take a different include path there —
        # one that only the (slow, tag-only) release workflow used to exercise.
        # -DGL_GLEXT_LEGACY makes Mesa's gl.h skip glext.h, reproducing that
        # path here in seconds. Two Windows-only breakages shipped through this
        # blind spot before the gate existed (include order, then missing
        # glext.h), each costing a full release-workflow round trip.
        run: |
          for f in src/OpenGLShader.cpp src/CrtEffectStack.cpp; do
            g++ -std=c++17 -DGL_GLEXT_LEGACY -c "$f" -o /dev/null \
                -Isrc -Iimgui -Ibuild || exit 1
          done
          echo "OK: GL TUs compile without glext.h (Windows include path)"

      - name: Compile the GLES 3.0 tier (Raspberry Pi path)
        # -DPOM1_GLES=ON is what the `raspberry` release job builds, and that job
        # only runs on a tag — the same blind spot the Windows include-path gate
        # above exists to close. POM1_GL_ES flips the include selection, the
        # `#version 300 es` prologue and the direct-vs-glfwGetProcAddress entry
        # points in these four TUs, so a desktop-GL-only refactor can break the
        # Pi package without any x86 build noticing.
        #
        # Only the four affected objects are compiled (a full second build would
        # roughly double CI wall time for no extra coverage) — the convenience
        # targets `src/<name>.o` carry the exact flags CMake would use. Mesa
        # provides GLES 3.0 on x86_64 too, so no ARM hardware is needed to prove
        # the code compiles and links against libGLESv2/libEGL.
        run: |
          set -euo pipefail
          cmake -S . -B build-gles -DPOM1_GLES=ON -DPOM1_ENABLE_TESTS=OFF
          for f in OpenGLShader CrtEffectStack PomRenderer_GL main_imgui; do
            cmake --build build-gles --target "src/$f.o"
          done
          echo "OK: GLES 3.0 TUs compile"

      # Split into the two lanes declared in tests/CMakeLists.txt rather than
      # one `ctest` run: every declared test carries exactly one of the two
      # labels, so the split costs nothing and a red step names WHICH product
      # broke. The emulator lane runs first because it is the release gate: it
      # must also be green on a machine with no cc65, which is why every
      # cc65-dependent test skips (77) rather than failing.
      - name: Run ctest, emulator lane (release gate)
        run: ctest --test-dir build --output-on-failure -L emulator

      - name: Run ctest, devtools lane (editors, DevBench, BASIC compilers)
        run: ctest --test-dir build --output-on-failure -L devtools

      - name: Rebuild CodeTank cartridges (byte-identical gate)
        run: make -C dev/codetank

      - name: Assemble the standalone tool/game sketches
        run: |
          make -C sketchs/tms9918/tool_diapo
          make -C sketchs/tms9918/tool_tmsload
          make -C sketchs/tms9918/game_maze3d

  # ── Build-only gates for the two platforms the release workflow ships ───────
  # No packaging, no code signing, no cc65 bundle: those belong to release.yml
  # and are slow. What these prove is the thing that actually breaks between
  # releases — that POM1's own sources still compile and link against each
  # platform's toolchain and system headers.
  #
  # NOTE for anyone tempted to reuse this job for packaging: the Homebrew GLFW
  # installed below is exactly what must NOT end up in a shipped .app. It is
  # single-arch and the linker bakes brew's absolute prefix into the binary.
  # release.yml builds GLFW from source, universal and static, for that reason.
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: brew install glfw

      - name: Fetch Dear ImGui (pin from IMGUI_VERSION)
        run: tools/ensure_imgui.sh imgui

      - name: Build POM1 (Metal backend, the macOS default)
        # -DPOM1_WERROR=ON since 23 août 2026: the tree was measured under
        # AppleClang 17 (39 warnings at 10 sites — unused constants, a stale
        # lambda capture, set-but-unread counters, the Metal stub's untouched
        # GL fields) and cleaned, so this gate starts green. Vendored code
        # under src/third_party stays outside the -Werror scope (CMakeLists).
        run: |
          cmake -S . -B build -DPOM1_WERROR=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Run ctest (Metal build)
        # The suite used to run on Linux only: this job built 50 test binaries
        # and threw them away. "It links on macOS" is not "it works on macOS",
        # and the difference is exactly where the platform bugs live — the Metal
        # renderer, the Cocoa file dialogs, the native-fullscreen seam. cc65 is
        # not installed here, so the cc65-gated tests report NOT RUN (77) rather
        # than failing, which is the behaviour they were written for.
        run: ctest --test-dir build --output-on-failure

      - name: Build POM1 (OpenGL backend, the documented macOS fallback)
        # POM1_RENDERER=opengl is a supported configuration users can select,
        # and it shares no compilation path with Metal — PomRenderer_GL.cpp is
        # not compiled at all in the job above. Untested means broken.
        run: |
          cmake -S . -B build-gl -DPOM1_RENDERER=opengl -DPOM1_WERROR=ON
          cmake --build build-gl -j"$(sysctl -n hw.ncpu)" --target \
            pom1_imgui test_sid_audio test_aci_tape_loading test_measured_cpu_rate

      - name: Run backend-parity tests (OpenGL build)
        # These are deliberately executed from build-gl, not reused from the
        # Metal tree above. They prove the fallback binary can apply every
        # preset before its first cycle, mutate topology under the live CPU,
        # and produce non-silent SID/cassette audio without a rendered frame.
        run: |
          ctest --test-dir build-gl --output-on-failure \
            -R '^(sid_audio_smoke|aci_tape_loading|measured_cpu_rate_smoke|headless_preset_matrix|architecture_check)$'

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GLFW via vcpkg (manifest mode, static triplet)
        # No package argument: the dependency and its pinned version live in the
        # repo-root vcpkg.json, and vcpkg rejects arguments in manifest mode.
        # Same triplet as release.yml so this compiles the configuration users
        # actually get.
        run: vcpkg install --triplet x64-windows-static

      - name: Fetch Dear ImGui (pin from IMGUI_VERSION)
        # Git Bash, so the pin stays single-sourced from the IMGUI_VERSION file
        # instead of being copy-pasted into this workflow — see CLAUDE.md.
        shell: bash
        run: tools/ensure_imgui.sh imgui

      - name: Build POM1
        # -DPOM1_WERROR=ON since septembre 2026. MSVC's /W4 was measured over
        # this tree first: 134 distinct sites. 102 were stb_vorbis, vendored and
        # charged to AudioDevice.cpp because the .c is #included there; they are
        # silenced at that include (plus /wd4701 on that one file — 4700+
        # warnings are decided during code generation and no pragma reaches that
        # point). The 30 POM1-owned ones were FIXED, not disabled: narrowings
        # made explicit, four shadowed declarations renamed, inet_ntoa replaced
        # by inet_ntop. One of the shadows was a live defect —
        # hgr_convert_smoke_test's letterbox block handed the converter the outer
        # image, so it tested letterbox bars on a source that has none.
        #
        # The class that kept the flag off for three red cycles is C4244 raised
        # inside MSVC's own headers, and the note that used to sit here sent the
        # search after the wrong one. It said `std::fill<vector_iterator<uint8_t>,
        # int>` in <xutility> and that POM1 "contains no `fill(` at all" — so the
        # site supposedly needed an instantiation backtrace and a Windows box.
        # Measured instead: the diagnostic is <utility>(277), std::pair's
        # converting constructor, `pair<uint8_t,uint8_t>::pair<int,int>`, and MSVC
        # names the caller two lines down. Two sites, both reached by grepping for
        # `pair<uint8_t`:
        #   tests/concurrent_frontends_smoke_test.cpp — pokeSidRegisters({{0,0x34},…})
        #   src/sidtrack/SidVoice.cpp — silenceRegisters()'s {REG_V1_CR, 0x00}
        # Both now spell the value `uint8_t{…}`. Note the first is a TEST source:
        # /W4 + /WX apply to the test binaries too, which is the point — they
        # compile the same device sources the app does.
        #
        # (Six `std::fill` calls over std::vector<uint8_t> were also given
        # explicit `static_cast<uint8_t>` values while chasing the old note.
        # They were NOT the reported class — MSVC never flagged them — but the
        # casts match the five neighbouring std::fill_n calls and are kept.)
        shell: bash
        run: |
          cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_TARGET_TRIPLET=x64-windows-static \
                -DPOM1_WERROR=ON
          cmake --build build --config Release -j

      - name: Run ctest
        # Until august 2026 NOT ONE POM1 test had ever executed on Windows: this
        # job compiled the 50 test binaries and discarded them. That is the
        # platform whose users are the least equipped to diagnose anything, so
        # it is the last place where "it links" should pass for "it works".
        # -C Release matches the multi-config generator's build above; without
        # it ctest looks for a Debug configuration that was never built.
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

  # ── WebAssembly (compile + link, no deploy) ────────────────────────────────
  # The web bundle used to be built by NOTHING on a push: .github/workflows/
  # pages.yml is the only job that runs emcc, and it runs on main, AFTER the
  # merge. So the one channel that needs no installation — the one a visitor
  # judges in ten seconds — was the least verified target in the repo.
  #
  # It cost a real breakage on 2026-08-22: the warnings pass commented out the
  # parameter name of `updateCpuExecution(float /*deltaTime*/)`, which is read
  # inside the `#if POM1_IS_WASM` branch two lines below. 92 local tests and
  # three desktop jobs stayed green while the only build that compiles that
  # line died at 29 %.
  #
  # Same commands as pages.yml on purpose — this must be the build the deploy
  # does, not a cheaper approximation of it — minus the upload.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the committed WASM cc65 toolchain is present
        run: tools/verify_wasm_cc65.sh

      - name: Fetch Dear ImGui (pin from IMGUI_VERSION)
        run: tools/ensure_imgui.sh imgui

      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build the WASM bundle
        # -DPOM1_WERROR=ON since septembre 2026, closing the last of the three
        # tiers (Linux and macOS have carried it since août). What kept the
        # browser build out was five functions that only the NATIVE paths call
        # -- the .size sidecar reader, the native picker's filter builder and
        # three cc65 bundle helpers -- each defined unconditionally while its
        # only caller sat inside a `#if !POM1_IS_WASM`. They are guarded now.
        # Emscripten is clang, so the flag is -Werror over the same
        # -Wall -Wextra the other POSIX tiers already gate on.
        run: |
          set -euo pipefail
          emcmake cmake -S . -B build-wasm-ci -DCMAKE_BUILD_TYPE=Release -DPOM1_WERROR=ON
          cmake --build build-wasm-ci -j"$(nproc)"

      - name: Assert the four deployed outputs exist
        # A link that "succeeds" without emitting POM1.data would deploy a page
        # that boots into an empty filesystem, so name the four files the site
        # actually serves instead of trusting the exit status alone.
        run: |
          set -euo pipefail
          for f in POM1.html POM1.js POM1.wasm POM1.data; do
            test -s "build-wasm-ci/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          ls -la build-wasm-ci/POM1.html build-wasm-ci/POM1.js \
                 build-wasm-ci/POM1.wasm build-wasm-ci/POM1.data

      # ── Browser smoke ──────────────────────────────────────────────────────
      # "The four outputs exist" still deploys a page that dies at load: a JS
      # exception, a WebGL2 init failure or a truncated POM1.data all look the
      # same to `test -s`. Load the page the way a visitor does — headless
      # Chromium on the exact site assembly pages.yml deploys — and require the
      # C++ first-frame callback (pom1FirstFrameReady → #bootSplash.hidden),
      # zero uncaught exceptions / console errors / failed requests, a live
      # configured CPU reported by the WASM probe, and a non-black canvas.
      # pages.yml runs the same check as a deploy gate; this
      # copy runs it per push, BEFORE the merge.
      - name: Assemble the site (same layout the deploy ships)
        run: tools/assemble_wasm_site.sh build-wasm-ci site

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Self-test the smoke checker
        # Proves the checker can FAIL (black canvas, JS throw, abort overlay),
        # not just pass — a checker that never fires reads as coverage while
        # providing none. Also proves the runner still has WebGL2 at all,
        # separating "the runner lost WebGL" from "POM1 broke".
        run: node tools/wasm_smoke.mjs --self-test

      - name: Browser smoke on the assembled site
        run: node tools/wasm_smoke.mjs site

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-smoke-screenshot-ci
          path: wasm-smoke.png
          if-no-files-found: ignore

  # ── Sanitizers (nightly + manual) ──────────────────────────────────────────
  # The one class of defect POM1's 90 functional tests cannot see. Nightly
  # rather than per-push because the instrumented suite is several times slower
  # and this catches latent damage, not the mistake you made ten seconds ago.
  #
  # ASan+UBSan and TSan are separate jobs on purpose: they are mutually
  # incompatible (ASan and TSan cannot instrument the same binary), and they
  # look for different things — memory damage vs. the emulation-thread/audio-
  # callback/UI races that the LockOrder ranks only cover for POM1's own three
  # mutexes.
  sanitizers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Long by design. ASan instruments every access to Memory's 64 KB array —
    # the 6502 interpreter's innermost loop — so the emulated-CPU-bound tests
    # run at least 20x slower (measured: applesoft_gen2_smoke 31.6 s clean,
    # past 600 s instrumented), and those two Applesoft tests dominate the run.
    # Nightly, so wall time is cheap. If it ever needs trimming, the lever is
    # `ctest -E "applesoft_(gen2|tms9918)_smoke"` — and skipping them must be
    # said out loud in the job name, never left implicit: a sanitizer job that
    # quietly covers less than it appears to is the failure mode to avoid.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: address+undefined
            sanitize: address,undefined
          - name: thread
            sanitize: thread
    name: sanitizers (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev cc65

      - name: Fetch Dear ImGui (pin from IMGUI_VERSION)
        run: tools/ensure_imgui.sh imgui

      - name: Build instrumented
        # RelWithDebInfo, not Release: the reports need symbols and line numbers
        # to be worth reading. POM1_SANITIZE forces LTO off by itself.
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DPOM1_SANITIZE=${{ matrix.sanitize }}
          cmake --build build-san -j"$(nproc)"

      - name: Run ctest instrumented
        env:
          # halt_on_error=1: a sanitizer finding is a failure, not a log line.
          # print_stacktrace makes the UBSan half actionable rather than a
          # one-line "runtime error" with no location.
          # The suppression files cover VENDORED code only (libresidfp): a
          # data race in its filter-table builders and a negative left shift
          # in its external filter. Both are upstream, both are reached by
          # nearly every test (anything that constructs a Memory builds a
          # SID), so without them these two jobs abort on third-party noise
          # and report nothing about POM1 — which is how they came to be
          # permanently red and therefore unread. See tests/*.supp.
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:suppressions=${{ github.workspace }}/tests/ubsan.supp
          TSAN_OPTIONS: halt_on_error=1:suppressions=${{ github.workspace }}/tests/tsan.supp
          # tools/test_lib_micro.py runs the instrumented POM1 once per micro-
          # test; its own per-command budget needs the same headroom the ctest
          # TIMEOUTs get (scaled x5 in tests/CMakeLists.txt under POM1_SANITIZE).
          POM1_MICRO_RUN_TIMEOUT: "300"
          # The ordinary PR test lasts 350 ms. TSan gets a sustained campaign
          # over the same production triangle to increase scheduling diversity.
          POM1_CONCURRENCY_STRESS_MS: ${{ matrix.sanitize == 'thread' && '5000' || '350' }}
        run: ctest --test-dir build-san --output-on-failure

  # ── Long fuzzing campaign, nightly ────────────────────────────────────────
  # Every PR runs these four targets as DETERMINISTIC drivers (fixed seed,
  # ~1 s total) — see tests/*_fuzz_test.cpp. This job builds the same checks
  # behind LLVMFuzzerTestOneInput and lets libFuzzer drive them for real.
  #
  # It needs clang: Apple clang and g++ ship no libFuzzer, which is exactly why
  # the deterministic driver is the DEFAULT rather than the fallback — a
  # fuzz-only gate would silently not run for most contributors.
  #
  # A finding here fails the job and uploads the offending input as an
  # artifact. That file is the deliverable: it becomes a regression case in the
  # matching *_smoke test, the way every defect these targets have already
  # found did.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        # libclang-rt-dev carries libFuzzer's runtime; clang alone is not enough.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-rt-dev \
                                  libglfw3-dev libgl1-mesa-dev

      - name: Fetch Dear ImGui (pin from IMGUI_VERSION)
        run: tools/ensure_imgui.sh imgui

      - name: Build fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DPOM1_FUZZERS=ON
          cmake --build build-fuzz -j"$(nproc)" \
                --target test_memory_image_fuzz test_pcm_file_fuzz \
                         test_snapshot_fuzz test_d64_fuzz

      # A corpus that survives between nights is what turns a fuzzer from a
      # random sampler into something that accumulates reach. Restored
      # best-effort: a cold cache just means this night starts from the seeds.
      - name: Restore fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Seed the corpus from real inputs
        # Real files reach far more of each parser than random bytes do, and
        # POM1 ships plenty: ~120 hex dumps, the cassette recordings, a disk
        # image. Seeds are additive — the cache keeps whatever libFuzzer found.
        run: |
          set -euo pipefail
          mkdir -p fuzz-corpus/memory_image fuzz-corpus/pcm \
                   fuzz-corpus/snapshot fuzz-corpus/d64
          # Flatten with a path-derived prefix: the same basename occurs in
          # several software/ subfolders, and a plain copy would drop all but
          # the first — silently seeding less than it appears to.
          seed() {
            dest="$1"; shift
            find "$@" -print0 | while IFS= read -r -d '' f; do
              cp -n "$f" "$dest/$(printf '%s' "$f" | md5sum | cut -c1-8)-$(basename "$f")"
            done
          }
          seed fuzz-corpus/memory_image software -type f \
               \( -name '*.txt' -o -name '*.hex' -o -name '*.apl' \
                  -o -name '*.mon' -o -name '*.tur' \)
          seed fuzz-corpus/pcm cassettes -type f \
               \( -name '*.wav' -o -name '*.aiff' -o -name '*.aif' \)
          seed fuzz-corpus/d64 disks -type f -name '*.d64'

          # A real snapshot, so the snapshot corpus starts from a file POM1
          # actually writes rather than a synthetic one. Not fatal if it fails
          # — but say so, because a corpus that quietly shrank still "passes".
          cmake --build build-fuzz -j"$(nproc)" --target pom1_imgui
          ./build-fuzz/POM1 --headless --preset 12 --exit-after-cycles 100000 \
                --snapshot-save fuzz-corpus/snapshot/live.snap \
            || echo "::warning::could not produce a live snapshot seed"

          for d in fuzz-corpus/*/; do
            printf '%s: %s file(s)\n' "$d" "$(find "$d" -type f | wc -l)"
          done

      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          set -o pipefail
          status=0
          for t in memory_image:test_memory_image_fuzz \
                   pcm:test_pcm_file_fuzz \
                   snapshot:test_snapshot_fuzz \
                   d64:test_d64_fuzz; do
            dir="${t%%:*}"; bin="${t##*:}"
            echo "::group::$bin"
            # -max_total_time keeps the four campaigns inside the job budget;
            # -max_len matches the biggest thing any of these parsers accepts.
            ./build-fuzz/tests/"$bin" "fuzz-corpus/$dir" \
                -max_total_time=900 -max_len=262144 -print_final_stats=1 \
                -artifact_prefix="fuzz-corpus/$dir/crash-" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: |
            fuzz-corpus/*/crash-*
            fuzz-corpus/*/leak-*
            fuzz-corpus/*/timeout-*
          if-no-files-found: ignore

  # ── Coverage by module, nightly ───────────────────────────────────────────
  # tools/coverage.py builds the tree with LLVM source-based coverage, runs the
  # whole ctest suite under it, and reports LINE + BRANCH coverage per module.
  #
  # It gates four modules and reports the rest. That asymmetry is the point: a
  # single percentage over 44 500 measurable lines averages a cycle-exact 6502
  # against 14 400 lines of ImGui drawing no test binary links, moves for the
  # wrong reasons, and is improved by testing whatever is easiest. The four
  # floors (cpu, parsers, topology, snapshot — THRESHOLDS in the script) sit
  # just under what the suite measures today, so they catch a module LOSING
  # coverage, which is what happens when a branch arrives without its case.
  #
  # Nightly, with the sanitizers and the fuzzers: the instrumented build is -O0
  # with LTO off and the suite runs several times slower.
  coverage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang llvm libglfw3-dev libgl1-mesa-dev cc65

      - name: Fetch Dear ImGui (pin from IMGUI_VERSION)
        run: tools/ensure_imgui.sh imgui

      - name: Coverage by module
        env:
          # llvm-cov and llvm-profdata must come from the SAME toolchain that
          # compiled the tree, or the profile is reported as an unsupported
          # format version and nothing else.
          CC: clang
          CXX: clang++
        run: python3 tools/coverage.py --gate --json coverage.json

      - name: Upload the table
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-by-module
          path: coverage.json
          if-no-files-found: ignore
