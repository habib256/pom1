# micro_gen2.cfg — ld65 layout for the GEN2 HGR micro-tests that outgrow
# micro.cfg (dev/lib/test/micro/t18+ drivers, run by tools/test_lib_micro.py).
#
# Target machine: a 48 KB GEN2 preset (PRESET: 11, RAM $0000-$BFFF). Both HGR
# pages ($2000-$5FFF) stay free for the routines under test.
#
#   $0000-$00FF  ZEROPAGE (driver + lib zero page)
#   $0F00-$0F7F  RESULT MAILBOX — same contract as micro.cfg ($0F00 = magic
#                $A5 written LAST, results from $0F01). Never allocated here.
#   $6000-$8FFF  ENTRY + CODE + RODATA (LOAD: 6000 / RUN: 6000)
#   $9000-$97FF  BSS (RAM-built tables: hgr_div7_ram, hgr_scanline_ram,
#                HGR_PLOT_TABLES_RAM, hgr_pages' hgr_hi2)
#   $9800-$9DFF  free for a driver's own buffers (t23/t24: PL_HIST = $9800)

MEMORY {
    ZP:    start = $0000, size = $0100, type = rw, define = yes;
    MAIN:  start = $6000, size = $3000, type = rw, define = yes, file = %O;
    RAMHI: start = $9000, size = $0800, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    ENTRY:    load = MAIN,  type = rw,  optional = yes;
    CODE:     load = MAIN,  type = rw;
    RODATA:   load = MAIN,  type = ro,  optional = yes;
    BSS:      load = RAMHI, type = bss, optional = yes, define = yes;
}
